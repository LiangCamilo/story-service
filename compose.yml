services:
  story-backend:
    build: .
    image: story-service:latest
    container_name: story-service
    ports:
      - "3000:3000"
    env_file:
      - ./.env
    networks:
      - story-network
    depends_on: 
      - story-db

  story-db:
    image: postgres:18
    restart: always
    env_file:
      - ./.env
    ports:
      - ${POSTGRES_PORT}:5432
    container_name: story-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    networks:
      - story-network
    volumes:
      - postgres_data:/var/lib/postgresql

  story-pgadmin:
    image: dpage/pgadmin4
    env_file:
      - .env
    container_name: story-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    ports:
      - ${PGADMIN_PORT}:80
    networks:
      - story-network
networks:
  story-network:
    name: story-network

volumes:
  postgres_data: